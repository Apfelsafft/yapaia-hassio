name: "Navi"
description: "Browser-basierte Fahrzeugnavigation (PKW & Wohnmobil) mit Home Assistant Integration"
version: "0.3.0"
slug: "navi"
init: false

arch:
  - aarch64
  - amd64
  - armv7

ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Navi Web Interface & API"

options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  ha_base_url: ""
  ha_token: ""
  graphhopper_url: "http://localhost:8989"
  photon_url: "http://localhost:2322"

schema:
  mqtt_host: str
  mqtt_port: int
  ha_base_url: str
  ha_token: str
  graphhopper_url: str
  photon_url: str

# Stabile Internetverbindung für den initialen Karten-Style-Download
# empfohlen, aber nicht zwingend (OSM-Raster-Fallback integriert).
