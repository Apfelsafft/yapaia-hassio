# =============================================================================
# nginx config for the Yapaia HA add-on
#
# - Listens on 8080 (matches ingress_port in config.yaml).
# - Serves the static Vite build from /opt/yapaia/frontend-dist.
# - Proxies /api/* and /ws/* to the FastAPI backend on 127.0.0.1:8000.
# - Ingress prefix stripping is done by HA Supervisor before requests reach us,
#   so this nginx sees plain "/api/route" etc. No path rewriting needed here.
# =============================================================================

# Disable nginx's stamping its version in error pages / Server headers.
server_tokens off;

# Default mime types
include /etc/nginx/mime.types;
default_type application/octet-stream;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /opt/yapaia/frontend-dist;
    index index.html;

    # Larger client body for potential PMTiles or addon uploads
    client_max_body_size 50M;

    # ── API proxy ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket proxy ────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Static frontend (SPA fallback) ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip for static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
